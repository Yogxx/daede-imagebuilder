name: Build daede image

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the generated firmware to GitHub Releases.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      imagebuilder_url:
        description: ImmortalWrt ImageBuilder Download Link
        required: true
        default: "https://downloads.immortalwrt.org/releases/25.12.2/targets/bcm27xx/bcm2711/immortalwrt-imagebuilder-25.12.2-bcm27xx-bcm2711.Linux-x86_64.tar.zst"
      preflight:
        description: Check that the package list is complete before building.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      rootfs_partsize:
        description: Root file system partition size (MB)
        required: true
        default: "1024"
      install_daede:
        description: Include luci-app-daede in the firmware.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      daede_release_tag:
        description: For the release version of luci-app-daede, it defaults to 'latest' to fetch the newest build.
        required: true
        default: "latest"
      daede_apk_url:
        description: "Optional: Directly specify the APK download URL for luci-app-daede"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zstd \
            file \
            wget \
            curl \
            qemu-utils \
            genisoimage

      - name: Build image
        env:
          IMAGEBUILDER_URL: ${{ inputs.imagebuilder_url }}
          PREFLIGHT: ${{ inputs.preflight }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
          INSTALL_DAEDE: ${{ inputs.install_daede }}
          DAEDE_RELEASE_TAG: ${{ inputs.daede_release_tag }}
          DAEDE_APK_URL: ${{ inputs.daede_apk_url }}
          GITHUB_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          chmod +x scripts/build-image.sh
          scripts/build-image.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ImmortalWrt-daede-raspi4
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: inputs.publish_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: daede-${{ github.run_number }}
          name: daede firmware ${{ github.run_number }}
          artifacts: out/*
          allowUpdates: true
          replacesArtifacts: true
          bodyFile: out/BUILD-MANIFEST.txt
